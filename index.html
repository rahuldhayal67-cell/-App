<style>

.small{text-align:center;color:#666;font-size:14px}
select {

<button onclick="saveProfile()">Save Profile ❤️</button>

<button onclick="logout()">Logout</button>

<script>

const SUPABASE_URL = "https://pgperzhczsoifkvdwshd.supabase.co";
const SUPABASE_KEY = "sb_publishable_q2Ph4B0MXko-tkYPnB2-nA_cleEm3mh";

const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

async function signup(){
 const email=document.getElementById("email").value;
 const password=document.getElementById("password").value;

let result;
try {
  result = await db.auth.signUp({email,password});
} catch(e) {
  alert("ERROR: " + e.message);
  return;
}
const {error}=result;

 document.getElementById("msg").textContent =
 error ? error.message : "Account created. Check your email to confirm.";
}

async function login(){
 const email=document.getElementById("email").value;
 const password=document.getElementById("password").value;

 const {data,error}=await db.auth.signInWithPassword({email,password});

 if(error){
   document.getElementById("msg").textContent=error.message;
   return;
 }

 showApp(data.user);
}

const locations = {
  Rajasthan: {
    Sikar: ["Sikar", "Fatehpur", "Lachhmangarh", "Neem Ka Thana", "Reengus"],
    Jaipur: ["Jaipur", "Amer", "Chomu", "Sanganer"],
    Ajmer: ["Ajmer", "Kishangarh", "Beawar"],
    Udaipur: ["Udaipur", "Gogunda", "Salumbar"]
  },

  "Tamil Nadu": {
    Ariyalur: ["Ariyalur", "Jayankondam", "Andimadam"],
    Chennai: ["Chennai"],
    Coimbatore: ["Coimbatore", "Pollachi", "Mettupalayam"],
    Madurai: ["Madurai", "Melur", "Thirumangalam"]
  }
};

function loadDistricts(){
  const state = document.getElementById("state").value;
  const district = document.getElementById("district");
  const city = document.getElementById("city");

  district.innerHTML = '<option value="">Select district</option>';
  city.innerHTML = '<option value="">Select city</option>';

  if(locations[state]){
    Object.keys(locations[state]).forEach(d => {
      district.innerHTML += `<option value="${d}">${d}</option>`;
    });
  }
}

function loadCities(){
  const state = document.getElementById("state").value;
  const district = document.getElementById("district").value;
  const city = document.getElementById("city");

  city.innerHTML = '<option value="">Select city</option>';

  if(locations[state] && locations[state][district]){
    locations[state][district].forEach(c => {
      city.innerHTML += `<option value="${c}">${c}</option>`;
    });
  }
}

async function logout(){
 await db.auth.signOut();
 showAuth();
}
async function saveProfile(){
  const name = document.getElementById("name").value;
  const age = document.getElementById("age").value;
  const bio = document.getElementById("bio").value;

  document.getElementById("profileMsg").textContent =
    "Profile saved ❤️";
}
function showApp(user){
 document.getElementById("auth").classList.add("hidden");
 document.getElementById("app").classList.remove("hidden");
 document.getElementById("user").textContent="Logged in as "+user.email;
}

function showAuth(){
 document.getElementById("auth").classList.remove("hidden");
 document.getElementById("app").classList.add("hidden");
}

db.auth.getSession().then(({data})=>{
 if(data.session) showApp(data.session.user);
});

</script>
