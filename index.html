<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Connect</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#f5f5f5;color:#222}
.box{max-width:420px;margin:auto;padding:25px}
h1{text-align:center;color:#ff3366}
input,button{width:100%;box-sizing:border-box;padding:14px;margin:7px 0;border-radius:10px;border:1px solid #ddd;font-size:16px}
button{background:#ff3366;color:white;border:0;font-weight:bold}
.card{background:white;border-radius:18px;padding:20px;margin-top:20px;box-shadow:0 3px 15px #ddd}
.hidden{display:none}
.small{text-align:center;color:#666;font-size:14px}
</style>
</head>

<body>

<div class="box">

<h1>Connect 💕</h1>

<div id="auth" class="card">
<h2>Welcome</h2>

<input id="email" type="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">

<button onclick="signup()">Create account</button>
<button onclick="login()">Login</button>

<p id="msg" class="small"></p>
</div>

<div id="app" class="card hidden">
<h2>You're logged in ❤️</h2>
<p id="user"></p>
<h3>Create your profile</h3>

<input id="name" type="text" placeholder="Your name">

<input id="age" type="number" placeholder="Your age">

<textarea id="bio" placeholder="Tell something about yourself"></textarea>

<button onclick="saveProfile()">Save Profile ❤️</button>

<p id="profileMsg" class="small"></p>
<button onclick="logout()">Logout</button>
</div>

</div>

<script>

const SUPABASE_URL = "https://pgperzhczsoifkvdwshd.supabase.co";
const SUPABASE_KEY = "sb_publishable_q2Ph4B0MXko-tkYPnB2-nA_cleEm3mh";

const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

async function signup(){
 const email=document.getElementById("email").value;
 const password=document.getElementById("password").value;

let result;
try {
  result = await db.auth.signUp({email,password});
} catch(e) {
  alert("ERROR: " + e.message);
  return;
}
const {error}=result;

 document.getElementById("msg").textContent =
 error ? error.message : "Account created. Check your email to confirm.";
}

async function login(){
 const email=document.getElementById("email").value;
 const password=document.getElementById("password").value;

 const {data,error}=await db.auth.signInWithPassword({email,password});

 if(error){
   document.getElementById("msg").textContent=error.message;
   return;
 }

 showApp(data.user);
}

async function logout(){
 await db.auth.signOut();
 showAuth();
}
async function saveProfile(){
  const name = document.getElementById("name").value;
  const age = document.getElementById("age").value;
  const bio = document.getElementById("bio").value;

  document.getElementById("profileMsg").textContent =
    "Profile saved ❤️";
}
function showApp(user){
 document.getElementById("auth").classList.add("hidden");
 document.getElementById("app").classList.remove("hidden");
 document.getElementById("user").textContent="Logged in as "+user.email;
}

function showAuth(){
 document.getElementById("auth").classList.remove("hidden");
 document.getElementById("app").classList.add("hidden");
}

db.auth.getSession().then(({data})=>{
 if(data.session) showApp(data.session.user);
});

</script>

</body>
</html>
