i<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MyDating</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5f5f5;
  overflow: hidden;
}

header {
  height: 65px;
  background: white;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 27px;
  font-weight: bold;
  color: #ff3158;
  box-shadow: 0 2px 8px #ccc;
}

#area {
  height: calc(100vh - 145px);
  display: flex;
  justify-content: center;
  align-items: center;
  position: relative;
}

.card {
  width: 350px;
  max-width: 90vw;
  height: 520px;
  background: white;
  border-radius: 22px;
  overflow: hidden;
  position: absolute;
  box-shadow: 0 5px 25px #aaa;
  touch-action: none;
  user-select: none;
}

.card img {
  width: 100%;
  height: 75%;
  object-fit: cover;
}

.info {
  padding: 12px 18px;
}

.name {
  font-size: 25px;
  font-weight: bold;
}

.bio {
  margin-top: 5px;
  color: #777;
}

.buttons {
  height: 80px;
  background: white;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 35px;
}

button {
  width: 60px;
  height: 60px;
  border-radius: 50%;
  border: none;
  background: white;
  box-shadow: 0 3px 12px #bbb;
  font-size: 27px;
}

.no {
  color: #ff4458;
}

.yes {
  color: #21c77a;
}

#match {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 10;
  background: linear-gradient(135deg,#ff3158,#ff7858);
  color: white;
  text-align: center;
  padding-top: 150px;
}

#match h1 {
  font-size: 48px;
}

#match button {
  width: 180px;
  border-radius: 30px;
  color: #ff3158;
}
</style>
</head>

<body>

<header>🔥 MyDating</header>

<div id="area">

<div class="card" id="card">
  <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=800">

  <div class="info">
    <div class="name">Sofia, 24</div>
    <div class="bio">Coffee • Travel • Music</div>
  </div>
</div>

</div>

<div class="buttons">
  <button class="no" onclick="swipeLeft()">✕</button>
  <button class="yes" onclick="swipeRight()">♥</button>
</div>

<div id="match">
  <h1>It's a Match! ❤️</h1>
  <p>You both liked each other.</p>
  <button onclick="closeMatch()">Continue</button>
</div>

<script>

const card = document.getElementById("card");

let startX = 0;
let currentX = 0;
let dragging = false;

card.addEventListener("pointerdown", function(e) {
  dragging = true;
  startX = e.clientX;
  card.setPointerCapture(e.pointerId);
});

card.addEventListener("pointermove", function(e) {
  if (!dragging) return;

  currentX = e.clientX - startX;

  card.style.transform =
    "translateX(" + currentX + "px) rotate(" +
    currentX / 15 + "deg)";
});

card.addEventListener("pointerup", function() {
  dragging = false;

  if (currentX > 120) {
    swipeRight();
  }
  else if (currentX < -120) {
    swipeLeft();
  }
  else {
    card.style.transform = "";
  }

  currentX = 0;
});

function swipeRight() {
  card.style.transform =
    "translateX(600px) rotate(25deg)";

  setTimeout(function() {
    document.getElementById("match").style.display = "block";
  }, 400);
}

function swipeLeft() {
  card.style.transform =
    "translateX(-600px) rotate(-25deg)";

  setTimeout(function() {
    card.style.transform = "";
    alert("Passed");
  }, 400);
}

function closeMatch() {
  document.getElementById("match").style.display = "none";
  card.style.transform = "";
}

</script>

</body>
</html>
